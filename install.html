<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1f3a" />
  <meta name="application-name" content="Tennis Player OS" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TPOS" />
  <title>Installa Tennis Player OS</title>

  <link rel="manifest" href="./manifest.webmanifest?v=1.2.5" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png" />
  <link rel="stylesheet" href="./assets/css/install-entry.css?v=1.2.5" />
</head>
<body>
  <main class="install-page">
    <section class="install-card" aria-labelledby="install-title">
      <div class="install-brand">
        <img src="./assets/icons/icon-192.png" alt="" class="install-icon" />
        <div>
          <div class="install-kicker">Tennis Player OS</div>
          <h1 id="install-title">Installa TPOS</h1>
        </div>
      </div>

      <p class="install-lead">
        Prima installa l’app. Poi apri TPOS dalla schermata Home ed effettua l’accesso.
      </p>

      <div id="install-content" class="install-content" aria-live="polite">
        <div class="install-loading">
          <span class="install-spinner" aria-hidden="true"></span>
          <span>Preparo l’installazione…</span>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./assets/js/installEntry.js?v=1.2.5"></script>
</body>
</html>
