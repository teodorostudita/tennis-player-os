name: Build Match Debrief Summary 1.2.22 Patch ZIP

on:
  push:
    branches: [ chatgpt/match-debrief-summary-v1.2.22 ]

permissions:
  contents: read

jobs:
  build-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build patch zip
        run: |
          rm -rf patch TPOS_patch_v1.2.22_Match_Debrief_Summary.zip
          mkdir -p patch/assets/css
          mkdir -p patch/assets/js/ui
          mkdir -p patch/assets/js

          cp README-PATCH.txt patch/README-PATCH.txt
          cp RELEASE_LOG.md patch/RELEASE_LOG.md
          cp assets/css/match.css patch/assets/css/match.css
          cp assets/js/releaseLog.js patch/assets/js/releaseLog.js
          cp assets/js/ui/matchUI.js patch/assets/js/ui/matchUI.js
          cp assets/js/ui/versionDashboard.js patch/assets/js/ui/versionDashboard.js
          cp assets/js/version.js patch/assets/js/version.js
          cp index.html patch/index.html
          cp sw.js patch/sw.js

          cd patch
          zip -r ../TPOS_patch_v1.2.22_Match_Debrief_Summary.zip .

      - name: Check JavaScript syntax
        run: |
          for file in             patch/assets/js/releaseLog.js             patch/assets/js/ui/matchUI.js             patch/assets/js/ui/versionDashboard.js             patch/assets/js/version.js             patch/sw.js
          do
            node --input-type=module --check < "$file"
          done

      - name: Verify patch scope and debrief behavior
        run: |
          test ! -e patch/tennis-player-os-site
          test ! -e patch/supabase
          grep -q "match-debrief-list" patch/assets/js/ui/matchUI.js
          grep -q "data-edit-debrief" patch/assets/js/ui/matchUI.js
          grep -q "Vengono mostrate soltanto le informazioni effettivamente registrate" patch/assets/js/ui/matchUI.js
          grep -q "APP_VERSION = '1.2.22'" patch/assets/js/version.js
          unzip -l TPOS_patch_v1.2.22_Match_Debrief_Summary.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TPOS_patch_v1.2.22_Match_Debrief_Summary
          path: TPOS_patch_v1.2.22_Match_Debrief_Summary.zip
          if-no-files-found: error
