name: Build Calendar Logistics Colors 1.2.21 Patch ZIP

on:
  push:
    branches: [ chatgpt/calendar-logistics-colors-v1.2.21 ]

permissions:
  contents: read

jobs:
  build-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build patch zip
        run: |
          rm -rf patch TPOS_patch_v1.2.21_Calendar_Logistics_Colors.zip
          mkdir -p patch/assets/css
          mkdir -p patch/assets/js/components
          mkdir -p patch/assets/js/ui
          mkdir -p patch/assets/js

          cp README-PATCH.txt patch/README-PATCH.txt
          cp RELEASE_LOG.md patch/RELEASE_LOG.md
          cp assets/css/styles.css patch/assets/css/styles.css
          cp assets/js/app.js patch/assets/js/app.js
          cp assets/js/bootstrap.js patch/assets/js/bootstrap.js
          cp assets/js/components/calendar.js patch/assets/js/components/calendar.js
          cp assets/js/releaseLog.js patch/assets/js/releaseLog.js
          cp assets/js/ui/versionDashboard.js patch/assets/js/ui/versionDashboard.js
          cp assets/js/version.js patch/assets/js/version.js
          cp index.html patch/index.html
          cp sw.js patch/sw.js

          cd patch
          zip -r ../TPOS_patch_v1.2.21_Calendar_Logistics_Colors.zip .

      - name: Check JavaScript syntax
        run: |
          for file in             patch/assets/js/app.js             patch/assets/js/bootstrap.js             patch/assets/js/components/calendar.js             patch/assets/js/releaseLog.js             patch/assets/js/ui/versionDashboard.js             patch/assets/js/version.js             patch/sw.js
          do
            node --input-type=module --check < "$file"
          done

      - name: Verify patch scope
        run: |
          test ! -e patch/tennis-player-os-site
          test ! -e patch/supabase
          grep -q "planner-logistics-legend" patch/assets/js/components/calendar.js
          grep -q "logistics-focus" patch/assets/css/styles.css
          grep -q "APP_VERSION = '1.2.21'" patch/assets/js/version.js
          unzip -l TPOS_patch_v1.2.21_Calendar_Logistics_Colors.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TPOS_patch_v1.2.21_Calendar_Logistics_Colors
          path: TPOS_patch_v1.2.21_Calendar_Logistics_Colors.zip
          if-no-files-found: error
