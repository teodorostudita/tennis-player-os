name: Build Mobile Calendar Fix 1.2.20 Patch ZIP

on:
  push:
    branches: [ chatgpt/mobile-calendar-stacking-v1.2.20 ]

permissions:
  contents: read

jobs:
  build-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build patch zip
        run: |
          rm -rf patch TPOS_patch_v1.2.20_Mobile_Calendar_Stacking_Fix.zip
          mkdir -p patch/assets/css
          mkdir -p patch/assets/js/ui
          mkdir -p patch/assets/js

          cp README-PATCH.txt patch/README-PATCH.txt
          cp RELEASE_LOG.md patch/RELEASE_LOG.md
          cp assets/css/mobile-calendar.css patch/assets/css/mobile-calendar.css
          cp assets/js/releaseLog.js patch/assets/js/releaseLog.js
          cp assets/js/ui/versionDashboard.js patch/assets/js/ui/versionDashboard.js
          cp assets/js/version.js patch/assets/js/version.js
          cp index.html patch/index.html
          cp sw.js patch/sw.js

          cd patch
          zip -r ../TPOS_patch_v1.2.20_Mobile_Calendar_Stacking_Fix.zip .

      - name: Check JavaScript syntax
        run: |
          for file in             patch/assets/js/releaseLog.js             patch/assets/js/ui/versionDashboard.js             patch/assets/js/version.js             patch/sw.js
          do
            node --input-type=module --check < "$file"
          done

      - name: Verify patch scope
        run: |
          test ! -e patch/tennis-player-os-site
          test ! -e patch/supabase
          grep -q "z-index: 8" patch/assets/css/mobile-calendar.css
          grep -q "APP_VERSION = '1.2.20'" patch/assets/js/version.js
          unzip -l TPOS_patch_v1.2.20_Mobile_Calendar_Stacking_Fix.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TPOS_patch_v1.2.20_Mobile_Calendar_Stacking_Fix
          path: TPOS_patch_v1.2.20_Mobile_Calendar_Stacking_Fix.zip
          if-no-files-found: error
