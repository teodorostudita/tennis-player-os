name: Build Perception Color 1.2.17 Patch ZIP

on:
  push:
    branches: [ chatgpt/perception-color-v1.2.17 ]

permissions:
  contents: read

jobs:
  build-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build patch zip
        run: |
          rm -rf patch TPOS_patch_v1.2.17_Perception_Color.zip
          mkdir -p patch/assets/css
          mkdir -p patch/assets/js/ui
          mkdir -p patch/assets/js

          cp README-PATCH.txt patch/README-PATCH.txt
          cp RELEASE_LOG.md patch/RELEASE_LOG.md
          cp assets/css/mental-visual.css patch/assets/css/mental-visual.css
          cp assets/js/releaseLog.js patch/assets/js/releaseLog.js
          cp assets/js/ui/mentalVisualUI.js patch/assets/js/ui/mentalVisualUI.js
          cp assets/js/ui/versionDashboard.js patch/assets/js/ui/versionDashboard.js
          cp assets/js/version.js patch/assets/js/version.js
          cp index.html patch/index.html
          cp sw.js patch/sw.js

          cd patch
          zip -r ../TPOS_patch_v1.2.17_Perception_Color.zip .

      - name: Check JavaScript syntax
        run: |
          for file in             patch/assets/js/releaseLog.js             patch/assets/js/ui/mentalVisualUI.js             patch/assets/js/ui/versionDashboard.js             patch/assets/js/version.js             patch/sw.js
          do
            node --input-type=module --check < "$file"
          done

      - name: Verify patch scope and color hooks
        run: |
          test ! -e patch/tennis-player-os-site
          test ! -e patch/supabase
          grep -q "mv-visual-domain-card" patch/assets/js/ui/mentalVisualUI.js
          grep -q "mv-visual-measure-card" patch/assets/js/ui/mentalVisualUI.js
          grep -q "v1.2.17 · Perception & Neuro color polish" patch/assets/css/mental-visual.css
          grep -q "APP_VERSION = '1.2.17'" patch/assets/js/version.js
          unzip -l TPOS_patch_v1.2.17_Perception_Color.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TPOS_patch_v1.2.17_Perception_Color
          path: TPOS_patch_v1.2.17_Perception_Color.zip
          if-no-files-found: error
