<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1f3a" />
  <title>Tennis Player OS — Offline</title>
  <style>
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f8fb; color: #0b1f3a; padding: 24px; }
    main { width: min(520px, 100%); background: white; border: 1px solid #dce5ee; border-radius: 22px; padding: 34px; box-shadow: 0 18px 60px rgba(11,31,58,.10); text-align: center; }
    .mark { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 20px; display: grid; place-items: center; background: #0b1f3a; color: #d7ee5c; font-weight: 800; letter-spacing: .04em; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0 auto 22px; max-width: 410px; line-height: 1.55; color: #526273; }
    button { border: 0; border-radius: 12px; padding: 12px 18px; font: inherit; font-weight: 700; background: #0b1f3a; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="mark">TPOS</div>
    <h1>Connessione assente</h1>
    <p>Tennis Player OS usa il cloud per mantenere aggiornati i dati dell’atleta. Riconnettiti a Internet e riprova.</p>
    <button type="button" onclick="location.reload()">Riprova</button>
  </main>
</body>
</html>
